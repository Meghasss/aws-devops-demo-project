apiVersion: apps/v1
kind: Deployment
metadata:
  name: megha-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: megha-app
  template:
    metadata:
      labels:
        app: megha-app
    spec:
      containers:
      - name: megha-app
        image: megha-app:v1
        ports:
        - containerPort: 80
